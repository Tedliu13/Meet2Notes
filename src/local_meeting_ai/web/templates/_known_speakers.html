<fieldset class="known-speaker-picker" id="{{ profile_picker_id }}">
  <legend data-i18n="known_speakers.title">Known speakers</legend>
  <p data-i18n="known_speakers.help">Select saved voices expected in this meeting. Only selected voices will be compared; uncertain voices remain unidentified. Leave empty to compare all saved voices.</p>
  <div class="known-speaker-list" data-known-profile-list></div>
  <p data-known-profile-status role="status" aria-live="polite"></p>
  <button class="text-button" type="button" data-known-profile-retry hidden data-i18n="known_speakers.retry">Reload saved voices</button>
</fieldset>
