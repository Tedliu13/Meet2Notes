services:
  meet2notes:
    # Temporary recovery: reuse the verified image already present on this VM.
    # No build or registry pull; later Git changes do not update application code.
    image: 9fusshae9rh2rgjkgtxstd2z_meet2notes:3fd006bd4611916946629a94a0e0ef0d4d7e4413
    pull_policy: never
    # Use only AFTER the offline migration tool reports VERIFIED.
    # Missing host directories are never created automatically.
    command:
      - /bin/sh
      - -ec
      - |
        python - <<'PY'
        import json
        from pathlib import Path
        for role in ('data', 'models', 'cache'):
            marker = Path('/') / role / '.meet2notes-storage-verified.json'
            if not marker.is_file() or json.loads(marker.read_text()).get('resource') != '9fusshae9rh2rgjkgtxstd2z':
                raise SystemExit('Storage migration has not been verified; refusing to initialize an empty workspace')
        if not Path('/data/app.db').is_file() or Path('/data/app.db').stat().st_size == 0:
            raise SystemExit('Migrated database is missing; refusing to initialize an empty workspace')
        PY
        exec meet2notes --host 0.0.0.0 --port 8765 --no-browser
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    expose:
      - "8765"
    environment:
      M2N_HOSTED: "true"
      M2N_HOST: 0.0.0.0
      M2N_PORT: "8765"
      M2N_ALLOWED_HOSTS: ${M2N_ALLOWED_HOSTS:-meet2notes.ncdrcc.com}
      M2N_AUTH_USERNAME: ${M2N_AUTH_USERNAME:?Set a private login username}
      M2N_AUTH_PASSWORD: ${M2N_AUTH_PASSWORD:?Set a strong private login password}
      M2N_SECRETS_KEY: ${M2N_SECRETS_KEY:?Set a Fernet encryption key}
      M2N_DATA_DIR: /data
      M2N_MODELS_DIR: /models
      M2N_MAX_UPLOAD_MB: ${M2N_MAX_UPLOAD_MB:-0}
      M2N_MAX_HEAVY_JOBS: ${M2N_MAX_HEAVY_JOBS:-4}
      M2N_CPU_THREADS: ${M2N_CPU_THREADS:-2}
      M2N_CHINESE_TRANSCRIPT_SCRIPT: ${M2N_CHINESE_TRANSCRIPT_SCRIPT:-traditional}
      M2N_LOG_LEVEL: ${M2N_LOG_LEVEL:-INFO}
      M2N_LLAMACPP_VERBOSE: ${M2N_LLAMACPP_VERBOSE:-true}
      M2N_PYANNOTE_TOKEN: ${M2N_PYANNOTE_TOKEN:-}
      OMP_NUM_THREADS: ${M2N_CPU_THREADS:-2}
      OPENBLAS_NUM_THREADS: ${M2N_CPU_THREADS:-2}
      MKL_NUM_THREADS: ${M2N_CPU_THREADS:-2}
    cpus: ${M2N_CPU_LIMIT:-8}
    mem_limit: ${M2N_MEMORY_LIMIT:-32g}
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - type: bind
        source: /data/meet2notes/data
        target: /data
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: /data/meet2notes/models
        target: /models
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: /data/meet2notes/cache
        target: /cache
        read_only: false
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
